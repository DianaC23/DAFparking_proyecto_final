    <title>Document</title>
</head>
<body>
    <!--Diana-->
    <header>
        <!--Barra de navegación siempre dentro del header-->
        <nav class="navegacion_principal">
            <!--Lista no ordenada que agrupa los enlaces-->
            <ul>
                <!--li es cada elemento de la lista-->
                <!--a es es link por ahora solo le pondremos # a los que aun no tenga pagina para que cuando le demos clic no e reinicie-->
                <li><a href="./index.html"><img src="./IMG_DAF/DAF_LOGO.png" alt="Logo DAF" class="logo"></a></li>
                <li><a href="./inicio_sesion.html">Iniciar sesión</a></li>
                <li><a href="#">Registrarse</a></li>
                <li><a href="#">Sobre nosotros</a></li>
                <li><a href="#">contacto</a></li>
            </ul>
        </nav>
    </header>
            <!--Inicio de accesibilidad web-->
        <div class="accesibilidad">
            <button id="Aumentar"><strong> A+</strong></button>
            <button id="Disminuir"><strong>A-</strong></button>
            <button id="Contraste"><strong>◑</strong></button>
            <button id="Dislexia"><strong>Ae</strong></button>
            <button id="lector"><strong> ၊၊||၊</strong></button>
            <button id="Recargar"><strong>⟳</strong></button>
        </div>
        <!--fin de accesibilidad web-->
    <main class="main-inicia-sesion">
        <!--Inicio de seion-->
        <form class="formu-inicio-sesion" name="ini_sesion" action="#" method="post" target="_blank" autocomplete="on" accept-charset="UTF-8"></form>
        <h2 class="subtitulo-inicia-sesion">Iniciar sesión</h2>
        <!--Agregue required para que entienda que esto es obligatorio-->
        <input class="datos-inicio" type="email" name="email" autocomplete="on" placeholder="nombre54321@gmail.com" id="usuario" required>
        <a class="r-datos" href="#">Recordar datos</a>
        <input class="datos-inicio" type="password" name="contraseña" autocomplete="on" placeholder="******************" id="clave" required>
        <a class="r-datos" href="#">Olvide la contraseña</a>
        <input class="btn-inicio-sesion" type="submit" value="Iniciar Sesión">
    </main>
    <footer>
        <div class="info">
            <p>DAF Solutions S.A.S</p>
            <p>calle 80 #28-45, Medellín, Colombia Tel: (+57) 312 678 9054</p>
            <a href="#"><img src="./IMG_DAF/icons8-facebook-96.png" alt="icono de facebook" class="info_icono"></a>
            <a href="#"><img src="./IMG_DAF/icons8-whatsapp-64.png" alt="icono de whatssap" class="info_icono"></a>
            <a href="#"><img src="./IMG_DAF/icons8-instagram-64.png" alt="icono de instagram" class="info_icono"></a>
        </div>
        
    </footer>
