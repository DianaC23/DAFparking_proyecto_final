</head>
<body>
  <!--Andrea-->
    <!--Barra de navegación siempre dentro del header-->
        <nav class="navegacion_principal">
            <!--Lista no ordenada que agrupa los enlaces-->
            <ul>
                <!--li es cada elemento de la lista-->
                <!--a es es link por ahora solo le pondremos # a los que aun no tenga pagina para que cuando le demos clic no e reinicie-->

                <li><a href="./inicio_sesion.html">Iniciar sesión</a></li>
                <li><a href="#">Registrarse</a></li>
                <li><a href="#">Sobre nosotros</a></li>
                <li><a href="#">contacto</a></li>
            </ul>
        </nav>
         <!--Inicio de accesibilidad web-->
        <div class="accesibilidad">
            <button id="Aumentar"><strong> A+</strong></button>
            <button id="Disminuir"><strong>A-</strong></button>
            <button id="Contraste"><strong>◑</strong></button>
            <button id="Dislexia"><strong>Ae</strong></button>
            <button id="lector"><strong> ၊၊||၊</strong></button>
            <button id="Recargar"><strong>⟳</strong></button>
        </div>
        <!--fin de accesibilidad web-->
  <main class="contenedor-factura">
    <h1>Factura</h1>
    <p>Aquí puedes consultar los detalles de tu servicio y realizar el pago correspondiente</p>

    <div class="formulario-factura">
      <div class="campo">
        <label>Placa</label>
        <input type="text" id="placa" placeholder="Ej: XYZ369">
      </div>

      <div class="campo">
        <label>Tipo de Vehículo</label>
        <select id="tipoVehiculo">
          <option value="carro">Carro</option>
          <option value="moto">Moto</option>
        </select>
      </div>

      <div class="campo">
        <label>Hora de ingreso</label>
        <input type="time" id="horaIngreso">
      </div>

      <div class="campo">
        <label>Hora de salida</label>
        <input type="time" id="horaSalida">
      </div>

      <div class="campo">
        <label>Tarifa por hora ($)</label>
        <input type="number" id="tarifa" placeholder="Ej: 2000">
      </div>

      <div class="campo">
        <label>Valor a cancelar ($)</label>
        <input type="text" id="valorCancelar" readonly>
      </div>
    </div>

    <h3>Método de pago</h3>
    <div class="metodos-pago">
      <button class="pago-btn">💵 Efectivo</button>
      <button class="pago-btn">💳 Tarjeta</button>
      <button class="pago-btn">📱 QR</button>
      <button class="pago-btn">🌐 En línea</button>
    </div>

    <div class="campo">
      <label>No. de comprobante (si aplica)</label>
      <input type="text" id="comprobante">
    </div>

    <div class="botones-factura">
      <button onclick="calcularPago()">💰 Realiza Pago</button>
      <button onclick="generarFactura()">🧾 Generar Factura</button>
    </div>
  </main>

    <footer>
        <div class="info">
            <p>DAF Solutions S.A.S</p>
            <p>calle 80 #28-45, Medellín, Colombia Tel: (+57) 312 678 9054</p>
            <a href="#"><img src="./IMG_DAF/icons8-facebook-96.png" alt="icono de facebook" class="info_icono"></a>
            <a href="#"><img src="./IMG_DAF/icons8-whatsapp-64.png" alt="icono de whatssap" class="info_icono"></a>
            <a href="#"><img src="./IMG_DAF/icons8-instagram-64.png" alt="icono de instagram" class="info_icono"></a>
        </div>
        
    </footer>

  <script src="script.js"></script>
</body>
</html>
